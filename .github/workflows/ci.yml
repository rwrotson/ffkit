name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run --no-sync poe fmt-check
      - run: uv run --no-sync poe lint
      - run: uv run --no-sync poe lint-imports
      - run: uv run --no-sync poe typecheck

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - if: runner.os == 'macOS'
        run: brew list ffmpeg || brew install ffmpeg
      - run: uv sync --locked --all-groups
      - run: uv run --no-sync poe test

  # Verify direct-dependency lower bounds with current transitive dependencies.
  lowest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv venv
      - run: uv pip install --resolution lowest-direct --group dev -e ".[cli]"
      - run: .venv/bin/pytest -W default::DeprecationWarning

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv build
      - name: Smoke-test the wheel
        run: |
          wheel=$(ls dist/*.whl)
          unzip -l "$wheel" | grep -q 'ffkit/py.typed'
          uv run --isolated --no-project --with "$wheel" \
            python -c "import ffkit; assert 'site-packages' in ffkit.__file__, ffkit.__file__"
          uv run --isolated --no-project --with "ffkit[cli] @ file://$PWD/$wheel" ffkit --version
      - run: uv run --no-sync properdocs build --strict
      - run: uv run --no-sync poe audit
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          skip-dirs: .venv
          exit-code: "1"
          severity: CRITICAL,HIGH
